<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Aerocámaras — En mantenimiento</title>
<style>
  :root {
    --night: #0d1b2a;
    --night-deep: #08131e;
    --paper: #f2ede2;
    --signal: #e2984a;
    --signal-dim: #a8703a;
    --line: rgba(242, 237, 226, 0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: radial-gradient(ellipse at 50% -10%, #14273c 0%, var(--night) 45%, var(--night-deep) 100%);
    color: var(--paper);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .scene {
    position: relative;
    width: 100%;
    max-width: 640px;
    padding: 64px 32px 56px;
    text-align: center;
  }

  /* radar sweep, single orchestrated motion */
  .radar {
    position: absolute;
    top: -140px;
    left: 50%;
    transform: translateX(-50%);
    width: 480px;
    height: 480px;
    pointer-events: none;
    z-index: 0;
  }
  .radar svg { width: 100%; height: 100%; }
  .radar-sweep {
    transform-origin: 240px 240px;
    animation: sweep 7s linear infinite;
  }
  @keyframes sweep {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .content {
    position: relative;
    z-index: 1;
  }

  .mark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 40px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--paper);
  }
  .mark svg { width: 22px; height: 22px; flex-shrink: 0; }
  .mark b { font-weight: 600; }

  .brand-bottom {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 48px;
  }
  .brand-bottom .logo {
    height: 64px;
    width: auto;
    display: block;
    opacity: 0.95;
    transition: opacity 0.2s ease;
  }
  .brand-bottom a {
    display: inline-block;
    line-height: 0;
  }
  .brand-bottom a:hover .logo {
    opacity: 1;
  }

  h1 {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 600;
    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.25;
    letter-spacing: -0.01em;
    margin: 0 0 20px;
    max-width: 460px;
    margin-left: auto;
    margin-right: auto;
  }

  p.lede {
    font-size: 18px;
    line-height: 1.65;
    color: rgba(242, 237, 226, 0.82);
    max-width: 420px;
    margin: 0 auto 36px;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--signal);
    margin: 0 auto 32px;
    opacity: 0.7;
  }

  .contact {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 15px;
    color: rgba(242, 237, 226, 0.6);
    line-height: 1.8;
  }

  .contact a {
    color: var(--paper);
    text-decoration: none;
    border-bottom: 1px solid var(--signal-dim);
    padding-bottom: 1px;
    transition: border-color 0.2s ease;
  }
  .contact a:hover { border-color: var(--signal); }

  @media (prefers-reduced-motion: reduce) {
    .radar-sweep { animation: none; }
  }

  @media (max-width: 480px) {
    .scene { padding: 48px 22px 40px; }
    .radar { top: -110px; width: 380px; height: 380px; }
  }
</style>
</head>
